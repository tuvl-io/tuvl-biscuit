# Build one abi3 wheel per platform (any CPython >= 3.11), test it on 3.11 and 3.14 on that
# platform, and publish to PyPI only for a v* tag (trusted publishing + build provenance).
name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  wheels:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: linux-x86_64, runner: ubuntu-latest, target: x86_64, manylinux: auto, test: true }
          - { name: linux-aarch64, runner: ubuntu-24.04-arm, target: aarch64, manylinux: auto, test: true }
          - { name: musllinux-x86_64, runner: ubuntu-latest, target: x86_64, manylinux: musllinux_1_2, test: false }
          - { name: musllinux-aarch64, runner: ubuntu-24.04-arm, target: aarch64, manylinux: musllinux_1_2, test: false }
          - { name: macos-x86_64, runner: macos-13, target: x86_64, test: true }
          - { name: macos-arm64, runner: macos-14, target: aarch64, test: true }
          - { name: windows-x64, runner: windows-latest, target: x64, test: true }
          - { name: windows-arm64, runner: windows-11-arm, target: aarch64, test: true }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: |
            3.11
            3.14
      - name: Build the abi3 wheel
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          manylinux: ${{ matrix.manylinux }}
          args: --release --out dist
      - name: Test the wheel on Python 3.11 and 3.14
        if: matrix.test
        shell: bash
        run: |
          for v in 3.11 3.14; do
            if command -v "python$v" >/dev/null; then "python$v" -m venv "venv-$v"; else py "-$v" -m venv "venv-$v"; fi
            bin="venv-$v/bin"; [ -d "$bin" ] || bin="venv-$v/Scripts"
            "$bin/python" -m pip install --quiet dist/*.whl pytest
            "$bin/python" -m pytest -q biscuit_test.py
          done
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.name }}
          path: dist

  sdist:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: PyO3/maturin-action@v1
        with:
          command: sdist
          args: --out dist
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-sdist
          path: dist

  publish:
    name: Publish to PyPI
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [wheels, sdist]
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: wheels-*
          merge-multiple: true
          path: dist
      - uses: actions/attest-build-provenance@v2
        with:
          subject-path: dist/*
      - uses: pypa/gh-action-pypi-publish@release/v1
